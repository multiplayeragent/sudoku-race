    .rv b { font-size: 14px; } .rv span { font-size: 12px; } .rv i { position: static; order: -1; width: 16px; font-size: 13px; }

<body>
<div id="app">

<script>
/* ═══ SUDOKU RACE · a Multiplayer Agent starter ═════════════════════════════════════════
 * Everyone gets the same sudoku. First to fill it wins. Versus, 1–8; bot racers fill seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ clue counts per difficulty, mistake penalty, bot speeds, timers
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, live ops
 *   SUDOKU ........ the seeded generator (one solution, checked by a solver)
 *   RACE (HOST) ... rounds, results, the co-op grid, the end of a race
 *   BOTS .......... race bots (their progress comes from timestamps) and co-op bots
 *   ME ............ my grid, digits and pencil marks, mistakes, my progress for others
 *   DRAW .......... the board: highlights, digits, pencil marks, flashes, confetti
 *   HUD & CARD .... clock, rivals' cards with their heatmaps, results, leaderboard, sound
 *   INPUT ......... tap/click a square, the number pad, keyboard
 *   MAIN LOOP ..... frame(), heartbeat, start-up
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The HOST is the lowest sessionId among live players (heartbeat `hb` seen in the last
 *     3s), worked out every frame. Only the host writes the shared fields:
 *       `race`  {id, v, phase, mode, diff, seed, pen, startAt, capAt, endsAt, m, doneMs, res, next}
 *               one JSON field; `v` only goes up. `res` = the results so far.
 *       `bots`  {r, v, list}: the bot racers (start time, solve time, mistakes) or co-op bots.
 *       `grid`  {id, v, s, o}: co-op only, the one shared grid (digits) and who placed each.
 *   - The puzzle comes from `seed` + `diff` through a seeded PRNG, so every client builds the
 *     same grid and knows its solution without anything more in state.
 *   - RACE: each player solves its OWN copy and writes its OWN `prog` (round, which squares
 *     are filled but not the digits, percent, mistakes, finish time) ~4 times a second.
 *     Rivals see that as a progress bar and a heatmap. The host copies finish times into
 *     `race.res` and ends the race when every racer is done (or gave up).
 *   - CO-OP: everyone fills the host's `grid`. A digit is an intent "put" {r, i, d}; it shows
 *     at once on your screen, the host checks it and writes it (a wrong one adds time for
 *     the whole team). Your selected square is in `prog` too, so the team sees it.
 *   - Other intents: "pick" {diff, mode} (next puzzle), "again" {}, "giveup" {} (co-op).
 *     Event "miss" {i, by} is only for the red flash when someone else misses.
 *   - Bots: race bots' progress is worked out from timestamps, so a new host just carries on.
 *   - Leaderboards "fastest-easy" / "-medium" / "-hard": race time incl. penalties, stored as
 *     36000000 - ms (boards keep the highest score), top 10 on the results card.
 *   - Live ops (no code): live config `mistakeSec` sets the penalty from the next puzzle.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,               // bots fill a race up to this many racers
  coopSeats: 3,           // ... and a co-op grid up to this many solvers
  countdownMs: 3000,      // 3-2-1 before the grid shows
  mistakeSec: 10,         // seconds a wrong digit adds to your time (live config: mistakeSec)
  resultsMs: 30000,       // the results card shows this long, then the next puzzle starts
  givens: { easy: 40, medium: 32, hard: 26 },   // clues left in the grid (fewer = harder)
  capMin: { easy: 20, medium: 30, hard: 45 },   // a puzzle ends after this many minutes regardless
  botReadMs: [1500, 6000],                      // a race bot looks at the grid this long before its first digit
  botSec: { easy: [170, 380], medium: [330, 640], hard: [540, 1020] }, // seconds a race bot takes to solve
  botMistakes: [0, 3],    // a race bot makes this many mistakes (min, max)
  coopBotSec: { easy: [4, 9], medium: [6, 12], hard: [8, 16] }, // seconds between a co-op bot's digits
  coopBotMistake: 0.05,   // chance a co-op bot's digit is wrong
  progressMs: 250,        // my progress goes out at most this often
  hintMs: 9000,           // the how-to-play hint shows this long at the start of a puzzle
  board: "fastest",       // leaderboard prefix: fastest-easy, fastest-medium, fastest-hard
};
const DIFFS = ["easy", "medium", "hard"], DIFF_NAMES = { easy: "Easy", medium: "Medium", hard: "Hard" };
const BOT_NAMES = ["Ada", "Kenji", "Nina", "Otto", "Priya", "Rafa", "Suki", "Theo"];
const COLORS = ["#4dabf7", "#ff6b6b", "#ffd43b", "#b197fc", "#ff8fc7", "#38d9a9", "#ff922b", "#748ffc"];
const LETTERS = "ABCDEFGH"; // a co-op square remembers its placer as the letter of their color
const BIG = 36000000;      // leaderboards keep the highest score: we store BIG - ms

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'sudoku-race',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true, live: { config: {}, active: [] },
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {}, onLive() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback); memo.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
const liveConfig = () => (net && net.live && net.live.config) || {};

// ── SUDOKU ──────────────────────────────────────────────────────────────────────────
// A grid is 81 numbers, row by row: 0 = empty, 1–9 = a digit.
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
const ROW = (i) => Math.floor(i / 9), COL = (i) => i % 9, BOX = (i) => Math.floor(ROW(i) / 3) * 3 + Math.floor(COL(i) / 3);
const UNITS = []; // the 27 rows, columns and boxes, each a list of 9 squares
for (let k = 0; k < 9; k++) {
  UNITS.push([...Array(9)].map((_, j) => k * 9 + j), [...Array(9)].map((_, j) => j * 9 + k));
  UNITS.push([...Array(9)].map((_, j) => (Math.floor(k / 3) * 3 + Math.floor(j / 3)) * 9 + (k % 3) * 3 + (j % 3)));
}
const UNITS_OF = [...Array(81)].map((_, i) => UNITS.filter((u) => u.includes(i)));
const PEERS = [...Array(81)].map((_, i) => [...new Set(UNITS_OF[i].flat())].filter((j) => j !== i));
const popcount = (m) => { let n = 0; while (m) { m &= m - 1; n++; } return n; };
/** Digits that could go in square i (bit d set = digit d fits). */
function candidates(a, i) { let m = 0x3fe; for (const j of PEERS[i]) m &= ~(1 << a[j]); return m; }
/** Fill the empty squares of a by backtracking, fewest options first. rnd shuffles the digit order
 *  (null = fixed). Stops after `limit` solutions; returns how many it found and the first one. */
function search(a, rnd, limit) {
  let found = 0, first = null;
  (function go() {
    let best = -1, bestM = 0, bestN = 10;
    for (let i = 0; i < 81; i++) if (!a[i]) { const m = candidates(a, i), n = popcount(m); if (n < bestN) { best = i; bestM = m; bestN = n; if (n < 2) break; } }
    if (best < 0) { found++; if (!first) first = a.slice(); return; }
    const ds = []; for (let d = 1; d <= 9; d++) if (bestM & (1 << d)) ds.push(d);
    if (rnd) shuffle(ds, rnd);
    for (const d of ds) { a[best] = d; go(); a[best] = 0; if (found >= limit) return; }
  })();
  return { found, first };
}
/** True when the grid can be finished using only "this is the only digit that fits" steps. */
function solvesBySingles(g) {
  const a = g.slice();
  for (let moved = true; moved; ) {
    moved = false;
    for (let i = 0; i < 81; i++) if (!a[i]) { const m = candidates(a, i); if (!m) return false; if (popcount(m) === 1) { a[i] = 31 - Math.clz32(m); moved = true; } }
    for (const u of UNITS) for (let d = 1; d <= 9; d++) {
      let spot = -1, n = 0;
      for (const i of u) { if (a[i] === d) { n = -1; break; } if (!a[i] && candidates(a, i) & (1 << d)) { spot = i; n++; } }
      if (n === 1) { a[spot] = d; moved = true; }
    }
  }
  return a.every(Boolean);
}
const puzzleCache = new Map();
/** The puzzle for a seed and difficulty: a random full grid, then clues taken away in mirrored
 *  pairs while it still has exactly one solution (Easy: and stays solvable by simple steps). */
function makePuzzle(seed, diff) {
  const key = seed + ":" + diff; if (puzzleCache.has(key)) return puzzleCache.get(key);
  const rnd = mulberry32(seed), sol = search(Array(81).fill(0), rnd, 1).first, puz = sol.slice(), target = CONFIG.givens[diff] || 32;
  let left = 81;
  for (const i of shuffle([...Array(41).keys()], rnd)) {
    if (left <= target) break;
    const j = 80 - i, keep = [puz[i], puz[j]];
    puz[i] = 0; puz[j] = 0;
    if (search(puz.slice(), null, 2).found === 1 && (diff !== "easy" || solvesBySingles(puz))) left -= i === j ? 1 : 2;
    else { puz[i] = keep[0]; puz[j] = keep[1]; }
  }
  const pz = { sol, puz, blanks: puz.filter((v) => !v).length };
  puzzleCache.set(key, pz); return pz;
}
const puzzleOf = (g) => makePuzzle(g.seed, g.diff);

// ── RACE (HOST) ─────────────────────────────────────────────────────────────────────
const host = { last: null, wasHost: false, round: -1, cells: null, own: null, dirty: false, lastWrite: 0, gridV: 0, bots: new Map(), botsJson: "", botsV: 0, lastBots: 0, lastCheck: 0, lastSync: 0 };
/** The round as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function race() {
  const g = shared("race", null);
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeRace(g) { g = { ...g, v: (race()?.v ?? 0) + 1 }; host.last = g; net.setShared("race", JSON.stringify(g)); return g; }
function newRound(id, pick) {
  const diff = DIFFS.includes(pick && pick.diff) ? pick.diff : "easy", mode = pick && pick.mode === "coop" ? "coop" : "race";
  const seed = Math.floor(Math.random() * 2 ** 31), startAt = Date.now() + CONFIG.countdownMs, pz = makePuzzle(seed, diff);
  const pen = Math.max(0, Math.min(120, Math.round(+liveConfig().mistakeSec || CONFIG.mistakeSec)));
  host.round = id; host.cells = pz.puz.slice(); host.own = pz.puz.map((v) => (v ? "-" : "."));
  host.dirty = mode === "coop"; flushGrid(true);
  makeBots(mode, diff, startAt);
  publishBots(true);
  return writeRace({ id, phase: "play", mode, diff, seed, pen, startAt, capAt: startAt + CONFIG.capMin[diff] * 60000, endsAt: 0, m: 0, doneMs: 0, res: [], next: { diff, mode } });
}
/** Become host: take the round, the co-op grid and the bots exactly as state has them. */
function adopt() {
  host.wasHost = true;
  const g = race(); if (!g) return;
  const pz = puzzleOf(g), f = shared("grid", null), b = shared("bots", null);
  const ok = f && f.id === g.id && typeof f.s === "string" && f.s.length === 81 && typeof f.o === "string" && f.o.length === 81;
  host.cells = ok ? [...f.s].map((ch) => (ch === "." ? 0 : +ch)) : pz.puz.slice();
  host.own = ok ? [...f.o] : pz.puz.map((v) => (v ? "-" : "."));
  host.round = g.id; host.dirty = false; host.gridV = (f && f.v) || 0; host.botsV = (b && b.v) || 0;
  host.bots.clear();
  if (b && b.r === g.id && Array.isArray(b.list)) for (const x of b.list) host.bots.set(x.i, { ...x });
}
function flushGrid(force) {
  const now = performance.now();
  if (!host.dirty || (!force && now - host.lastWrite < 100)) return; // at most 10 writes a second
  host.dirty = false; host.lastWrite = now;
  host.gridV = Math.max(host.gridV, shared("grid", {})?.v || 0) + 1;
  net.setShared("grid", JSON.stringify({ id: host.round, v: host.gridV, s: host.cells.map((d) => d || ".").join(""), o: host.own.join("") }));
}

    ctx.font = `800 ${Math.round(cs * 0.42)}px system-ui, sans-serif`; ctx.fillText(`${DIFF_NAMES[g.diff]} · ${g.mode === "coop" ? "Co-op" : "Race"}`, x0 + size / 2, y0 + size * 0.78);
  }
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k]; p.life -= dt; p.vy += 22 * dt; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
    if (p.life <= 0) { parts.splice(k, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); ctx.globalAlpha = 1;
  }
}
/** Co-op: everyone else's selected square, outlined in their color with their name. */
function drawTeamCursors(g, now) {
  const { cs, x0, y0 } = geo, list = [];
  for (const id of livePlayers()) { if (id === net.sessionId) continue; const pr = progOf(id); if (pr.r === g.id && pr.s >= 0) list.push({ s: pr.s, n: nameOf(id), c: colorOf(id) }); }
  for (const b of botList(g)) if (b.s >= 0) list.push({ s: b.s, n: b.n, c: b.c });
  ctx.lineWidth = 3; ctx.font = "700 11px system-ui, sans-serif";
  for (const c of list) {
    const x = x0 + COL(c.s) * cs, y = y0 + ROW(c.s) * cs, pulse = 0.5 + 0.5 * Math.sin(now / 180);
    ctx.strokeStyle = c.c; ctx.globalAlpha = 0.7 + 0.3 * pulse; ctx.strokeRect(x + 2, y + 2, cs - 4, cs - 4); ctx.globalAlpha = 1;
    const w = ctx.measureText(c.n).width + 8; ctx.fillStyle = c.c; ctx.beginPath(); ctx.roundRect(x + cs - 6, y - 8, w, 15, 4); ctx.fill();
    ctx.fillStyle = "#14172b"; ctx.textAlign = "left"; ctx.fillText(c.n, x + cs - 2, y); ctx.textAlign = "center";
  }
}

// ── HUD & CARD ──────────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (ms) => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const byRank = (a, b) => (a.t && b.t ? a.t - b.t : a.t ? -1 : b.t ? 1 : (b.p || 0) - (a.p || 0));
let auth = null, cardAt = 0, lastPhase = "", dropped = false, giveUpArm = 0;
const boards = {};
const boardFor = (diff) => (auth ? (boards[diff] = boards[diff] || auth.leaderboard(`${CONFIG.board}-${diff}`)) : null);
/** Everyone in this puzzle for the side cards: racers with their heatmaps, or the co-op crew. */
function roster(g) {
  const out = [], now = Date.now(), coop = g.mode === "coop", grid = coop ? gridNow(g) : null, pz = puzzleOf(g);
  const crewHeat = (c) => { const L = letterOf(c); let n = 0; const h = grid.own.map((o, i) => (pz.puz[i] ? "-" : o === L ? (n++, "#") : ".")).join(""); return { h, n }; };
  for (const id of livePlayers()) {
    const pr = progOf(id); if (pr.r !== g.id) continue;
    const c = colorOf(id), row = { id, n: id === net.sessionId ? "You" : nameOf(id), c, me: id === net.sessionId };
    if (coop) { const { h, n } = crewHeat(c); Object.assign(row, { heat: h, cnt: n }); } else Object.assign(row, { heat: pr.h, p: pr.p | 0, m: pr.m | 0, t: pr.t | 0, g: pr.g });
    out.push(row);
  }
  for (const b of botList(g)) {
    if (coop) { const { h, n } = crewHeat(b.c); out.push({ id: b.i, n: b.n, c: b.c, bot: true, heat: h, cnt: n }); }
    else { const v = botView(b, g, now); out.push({ id: b.i, n: b.n, c: b.c, bot: true, heat: v.heat, p: v.p, m: v.m, t: v.t }); }
  }
  return coop ? out.sort((a, b) => b.cnt - a.cnt) : out.sort(byRank);
}
const cards = new Map(); // id -> { el, heatKey }
/** The rival cards: a mini heatmap of filled squares (not digits), a progress bar and a status. */
function rivalsUI(g) {
  const list = roster(g), box = $("rivals"), seen = new Set();
  list.forEach((r, k) => {
    let c = cards.get(r.id);
    if (!c) {
      const el = document.createElement("div"); el.className = "rv";
      el.innerHTML = `<i></i><canvas width="92" height="92"></canvas><div class="info"><b></b><div class="bar"><u></u></div><span></span></div>`;
      box.appendChild(el); c = { el, heatKey: "" }; cards.set(r.id, c);
    }
    seen.add(r.id);
    c.el.style.order = k; c.el.classList.toggle("me", !!r.me); c.el.classList.toggle("done", !!r.t);
    c.el.querySelector("i").textContent = g.mode === "race" ? k + 1 : "";
    c.el.querySelector("b").textContent = r.n + (r.bot ? " 🤖" : "");
    const pct = g.mode === "race" ? r.p : Math.round((100 * r.cnt) / puzzleOf(g).blanks);
    Object.assign(c.el.querySelector("u").style, { width: pct + "%", background: r.c });
    c.el.querySelector("span").textContent = g.mode === "coop" ? `${r.cnt} placed` : r.t ? `✓ ${fmt(r.t)}` : r.g ? "gave up" : `${r.p}%${r.m ? " · ✖" + r.m : ""}`;
    const key = r.heat + r.c;
    if (key !== c.heatKey && typeof r.heat === "string" && r.heat.length === 81) { c.heatKey = key; drawHeat(c.el.querySelector("canvas"), r.heat, r.c); }
  });
  for (const [id, c] of cards) if (!seen.has(id)) { c.el.remove(); cards.delete(id); }
}
function drawHeat(canvas, heat, color) {
  const h = canvas.getContext("2d"), s = 10, gap = 1;
  h.clearRect(0, 0, 92, 92);
  for (let i = 0; i < 81; i++) {
    const x = COL(i) * s + Math.floor(COL(i) / 3) * gap, y = ROW(i) * s + Math.floor(ROW(i) / 3) * gap;
    h.fillStyle = heat[i] === "#" ? color : heat[i] === "-" ? "#4a5085" : "#2d3260";
    h.fillRect(x, y, s - 1, s - 1);
  }
}
function hud(g) {
  const coop = g.mode === "coop", pen = g.pen * 1000;
  $("diff").textContent = `${DIFF_NAMES[g.diff]} · ${coop ? "Co-op" : "Race"}`;
  const miss = coop ? g.m : me.mistakes;
  $("miss").textContent = miss ? `✖ ${miss} (+${miss * g.pen}s)` : "";
  const t = Date.now() < g.startAt ? 0 : coop ? (g.phase === "done" ? g.doneMs : Date.now() - g.startAt + g.m * pen) : me.doneMs || (me.start ? Date.now() - me.start + me.mistakes * pen : 0);
  $("clock").textContent = fmt(Math.max(0, t));
  const n = livePlayers().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the race" : ""}`;
  const fresh = Date.now() - g.startAt < CONFIG.hintMs && g.phase === "play";
  $("hint").style.opacity = fresh && !ATTRACT ? 1 : 0;
  $("hint").textContent = coop ? "One grid for the whole team · a wrong digit adds time for everyone" : touchUI ? "Tap a square, then a number · ✎ for pencil marks · wrong digits cost time" : "Click a square, type 1–9 · Shift+digit or ✎ for pencil marks · wrong digits cost time";
  const waiting = roster(g).filter((r) => !r.t && !r.g).length;
  $("banner").textContent = !coop && g.phase === "play" && me.doneMs ? `✓ Finished in ${fmt(me.doneMs)} · ${waiting ? `waiting for ${waiting} racer${waiting === 1 ? "" : "s"}` : "that's everyone"}` : !coop && me.gaveUp && g.phase === "play" ? "You gave up · watching the race" : "";
  rivalsUI(g); padUI(g);
  if (cardAt && performance.now() > cardAt) { cardAt = 0; $("over").hidden = false; }
  if (!$("over").hidden) { $("nextIn").textContent = `Next puzzle in ${Math.max(0, Math.ceil((g.endsAt - Date.now()) / 1000))}s`; pickUI(g); }
}
function pickUI(g) {
  for (const b of $("pickDiff").children) b.classList.toggle("on", b.dataset.d === g.next.diff);
  for (const b of $("pickMode").children) b.classList.toggle("on", b.dataset.m === g.next.mode);
}
/** Once per change of phase: the results card (race ranks or the team's time) and the leaderboard. */
function onPhase(g) {
  const key = g.id + g.phase; if (key === lastPhase) return; lastPhase = key;
  if (g.phase === "play") { $("over").hidden = true; cardAt = 0; return; }
  if (g.mode === "coop" && g.doneMs) { confetti(); sfx("win"); }
  if (ATTRACT) return;
  cardAt = performance.now() + 1200;
  const res = g.res.slice().sort(byRank), place = res.findIndex((r) => r.i === net.sessionId), mine = res[place];
  if (g.mode === "race") {
    $("overTitle").textContent = mine && mine.t ? (place === 0 ? "You won! 🏆" : `You finished ${place + 1}${["st", "nd", "rd"][place] || "th"}`) : "Race over";
    $("overText").textContent = mine && mine.t ? `${fmt(mine.t)}${mine.m ? ` · ${mine.m} mistake${mine.m === 1 ? "" : "s"} (+${mine.m * g.pen}s)` : " · no mistakes"}` : `${DIFF_NAMES[g.diff]} puzzle`;
    $("ranksTitle").textContent = "This race";
    $("ranks").innerHTML = res.map((r) => `<li><i style="background:${esc(r.c)}"></i>${esc(r.i === net.sessionId ? "You" : r.n)}<span>${r.t ? fmt(r.t) + (r.m ? " ✖" + r.m : "") : "DNF " + (r.p | 0) + "%"}</span></li>`).join("") || "<li>Nobody finished.</li>";
  } else {
    $("overTitle").textContent = g.doneMs ? "Solved together! 🤝" : "Puzzle over";
    $("overText").textContent = g.doneMs ? `${fmt(g.doneMs)}${g.m ? ` · ${g.m} team mistake${g.m === 1 ? "" : "s"} (+${g.m * g.pen}s)` : " · no mistakes"}` : "Not finished this time.";
    $("ranksTitle").textContent = "Squares placed";
    $("ranks").innerHTML = roster(g).map((r) => `<li><i style="background:${esc(r.c)}"></i>${esc(r.n)}<span>${r.cnt}</span></li>`).join("");
  }
  const board = g.mode === "race" ? boardFor(g.diff) : null, top = $("top");
  $("boardBox").hidden = g.mode !== "race";
  $("boardTitle").textContent = `Fastest ${DIFF_NAMES[g.diff]} races`;
  if (!board) { top.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  top.innerHTML = "<li>Loading…</li>";
  (me.submitted || Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    top.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${fmt(BIG - e.score)}</span></li>`).join("") : "<li>No times yet. Be the first.</li>";
  }).catch(() => { top.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
let audio = null;
function sfx(kind) {
  if (!audio) return;
  try {
    const t = audio.currentTime, tone = (f, d, type = "triangle", v = 0.06, f2 = f, at = 0) => { const o = audio.createOscillator(), gn = audio.createGain(); o.type = type; o.frequency.setValueAtTime(f, t + at); o.frequency.exponentialRampToValueAtTime(f2, t + at + d); gn.gain.setValueAtTime(v, t + at); gn.gain.exponentialRampToValueAtTime(0.0001, t + at + d); o.connect(gn).connect(audio.destination); o.start(t + at); o.stop(t + at + d + 0.02); };
    if (kind === "place") tone(660, 0.09, "triangle", 0.06, 880);
    if (kind === "pencil") tone(1200, 0.04, "sine", 0.03);
    if (kind === "miss") tone(220, 0.25, "sawtooth", 0.05, 110);
    if (kind === "tick") tone(520, 0.08, "square", 0.03);
    if (kind === "win") [523, 659, 784, 1046].forEach((f, k) => tone(f, 0.2, "triangle", 0.07, f, k * 0.1));
  } catch {}
}
/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. Bots' colors count too. */
function fixColor() {
  const g = race(), others = livePlayers().filter((id) => id !== net.sessionId), botColors = botList(g).map((b) => b.c);
  if (!others.some((id) => S.entities.players[id]?.c === myColor && id < net.sessionId) && !botColors.includes(myColor)) return;
  const taken = new Set([...others.map((id) => S.entities.players[id]?.c), ...botColors]), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); }
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
const wake = () => { if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
const padKeys = [1, 2, 3, "pencil", 4, 5, 6, "erase", 7, 8, 9, "giveup"];
$("pad").innerHTML = padKeys.map((k) => typeof k === "number" ? `<button data-k="${k}">${k}<sup></sup></button>` : `<button class="tool" data-k="${k}">${{ pencil: "✎ Pencil", erase: "⌫ Erase", giveup: "⚑ Give up" }[k]}</button>`).join("");
function padUI(g) {
  const cells = viewCells(g), count = Array(10).fill(0); for (const d of cells) count[d]++;
  for (const b of $("pad").children) {
    const k = b.dataset.k;
    if (+k) { b.classList.toggle("used", count[k] >= 9); b.querySelector("sup").textContent = 9 - count[k] || ""; }
    if (k === "pencil") b.classList.toggle("on", me.pencilMode);
    if (k === "giveup") { const armed = performance.now() < giveUpArm; b.classList.toggle("warn", armed); b.textContent = armed ? "Sure? Tap again" : "⚑ Give up"; }
  }
}
function padPress(k, shift) {
  const g = race(); if (!g) return;
  if (+k) placeAt(me.sel, +k, me.pencilMode || shift);
  else if (k === "pencil") me.pencilMode = !me.pencilMode;
  else if (k === "erase") me.pencil[me.sel] = 0;
  else if (k === "giveup") { if (performance.now() < giveUpArm) { giveUpArm = 0; giveUp(); } else giveUpArm = performance.now() + 2500; }
  padUI(g); publish(false);
}
$("pad").addEventListener("pointerdown", (e) => { const b = e.target.closest("button"); if (!b) return; e.preventDefault(); wake(); padPress(b.dataset.k, e.shiftKey); });
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); wake();
  const r = cv.getBoundingClientRect(), c = Math.floor((e.clientX - r.left - geo.x0) / geo.cs), w = Math.floor((e.clientY - r.top - geo.y0) / geo.cs);
  if (c >= 0 && c < 9 && w >= 0 && w < 9) { me.sel = w * 9 + c; publish(false); }
});
cv.addEventListener("contextmenu", (e) => e.preventDefault());
addEventListener("keydown", (e) => {
  wake();
  const digit = /^Digit[1-9]$/.test(e.code) ? +e.code.slice(5) : /^Numpad[1-9]$/.test(e.code) ? +e.code.slice(6) : 0;
  if (digit) { e.preventDefault(); padPress(digit, e.shiftKey); return; }
  const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] }[e.key];
  if (mv) { e.preventDefault(); me.sel = ((ROW(me.sel) + mv[1] + 9) % 9) * 9 + ((COL(me.sel) + mv[0] + 9) % 9); publish(false); }
  if (e.key === "p" || e.key === " ") { e.preventDefault(); padPress("pencil"); }
  if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") padPress("erase");
});
for (const b of $("pickDiff").children) b.onclick = () => { const m = { diff: b.dataset.d }; if (isHost()) applyPick(m); else net.send("pick", m); };
for (const b of $("pickMode").children) b.onclick = () => { const m = { mode: b.dataset.m }; if (isHost()) applyPick(m); else net.send("pick", m); };
$("again").onclick = () => { if (isHost()) applyAgain(); else net.send("again", {}); };
document.addEventListener("touchmove", (e) => { if (!e.target.closest(".card, #rivals")) e.preventDefault(); }, { passive: false });

// ?attract: I solve quickly like a sharp human (a pencil mark here, a mistake there) while bots race.
const auto = { next: 0, step: 0, target: -1, wrong: false };
function autoTick(g, now) {
  if (!canPlay(g) || now < auto.next) return;
  const pz = puzzleOf(g), cells = me.cells;
  if (auto.target < 0 || cells[auto.target]) { // the next square: few options, close to the last one
    let best = -1, bestS = 99;
    for (let i = 0; i < 81; i++) if (!cells[i]) { const s = popcount(candidates(cells, i)) * 2 + Math.abs(ROW(i) - ROW(me.sel)) + Math.abs(COL(i) - COL(me.sel)) * 0.7 + Math.random() * 2; if (s < bestS) { best = i; bestS = s; } }
    auto.target = best; me.sel = best; auto.step++; auto.next = now + rnd(70, 140); return;
  }
  const i = auto.target, d = pz.sol[i];
  if (auto.step % 12 === 6 && !auto.wrong) { auto.wrong = true; placeAt(i, (d % 9) + 1, false); auto.next = now + 380; return; }
  if (auto.step % 5 === 2 && !me.pencil[i]) { placeAt(i, d, true); placeAt(i, (d % 9) + 1, true); auto.next = now + 260; return; }
  auto.wrong = false; placeAt(i, d, false); auto.next = now + rnd(70, 150);
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, lastCount = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: let the stand-in host's state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be timed before load: never negative
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(now); else host.wasHost = false;
  const g = race();
  if (!g) return;
  if (g.id !== me.round) onRound(g);
  if (!me.start && g.phase === "play" && Date.now() >= g.startAt) me.start = Math.max(g.startAt, me.seenAt); // a late joiner's clock starts when it arrived
  const left = Math.ceil((g.startAt - Date.now()) / 1000); if (left > 0 && left !== lastCount) { lastCount = left; sfx("tick"); }
  if (ATTRACT) autoTick(g, now);
  onPhase(g);
  publish(false);
  draw(g, dt, now);
  if (now - lastHud > 200) { lastHud = now; hud(g); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("put", (m, from) => { if (isHost()) applyPut(from, m); });
  net.on("pick", (m) => { if (isHost()) applyPick(m); });
  net.on("again", () => { if (isHost()) applyAgain(); });
  net.on("giveup", () => { if (isHost()) applyGiveUp(); });
  net.on("miss", (m) => { const g = race(); if (m && m.by !== net.sessionId && g && g.mode === "coop") missFx(m.i | 0, m.d | 0); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") auth = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl });
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...((shared("bots", null) || {}).list || []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { $("net").style.display = "none"; $("hint").style.display = "none"; Object.assign(CONFIG, { seats: 5, countdownMs: 1200, resultsMs: 2500, botReadMs: [300, 1200], botSec: { ...CONFIG.botSec, easy: [7, 13] }, botMistakes: [0, 2] }); }
  requestAnimationFrame(frame);
})();
